<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1c2230;--mut:#6b7385;--line:#e3e6ec;--acc:#1f6feb;--accl:#e8f0fe;--ok:#1a7f4b;--okl:#e6f4ec;--warn:#9a6700;--warnl:#fff6dd;--bad:#b42318;--badl:#fdecea}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
.demo{background:#1c2230;color:#fff;font-size:12px;text-align:center;padding:6px 10px}
header{background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header .logo{font-weight:700;font-size:17px}header .logo span{color:var(--acc)}header .sp{flex:1}
.wrap{max-width:720px;margin:0 auto;padding:14px}.wide{max-width:1200px}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.pri{background:var(--acc);color:#fff;border-color:var(--acc)}.pri:disabled{background:#a9bfe6;border-color:#a9bfe6;cursor:not-allowed}
.sm{min-height:36px;padding:6px 10px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
input[type=search],input[type=text],textarea,select{font:inherit;width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;min-height:44px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0}.chip{border-radius:999px;white-space:nowrap;min-height:38px;padding:6px 14px;font-size:13px}.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.store{display:flex;gap:12px;align-items:center;cursor:pointer}.store .m{flex:1;min-width:0}.store b{font-size:16px}.mut{color:var(--mut);font-size:13px}
.badge{font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;white-space:nowrap}
.b-ns{background:#eef0f3;color:#4a5263}.b-ip{background:var(--accl);color:var(--acc)}.b-sub{background:var(--okl);color:var(--ok)}.b-iss{background:var(--badl);color:var(--bad)}.b-cig{background:var(--warnl);color:var(--warn)}
.role{display:grid;gap:14px;margin-top:30px}.role button{min-height:96px;flex-direction:column;align-items:flex-start;text-align:left;padding:18px;font-size:18px}.role small{font-weight:400;color:var(--mut);font-size:14px}
h2{font-size:20px;margin:6px 0 4px}h3{font-size:16px;margin:0 0 10px;display:flex;justify-content:space-between}
.task{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}.task:first-of-type{border-top:0}
.task input{width:24px;height:24px;accent-color:var(--acc);flex:none;margin-top:1px}
.cond{font-size:11px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.04em}
.warnbox{background:var(--warnl);color:var(--warn);border-radius:10px;padding:10px 12px;font-weight:600;font-size:14px;margin-top:8px}
.note{background:#f0f2f5;border-radius:10px;padding:8px 12px;font-size:13px;color:var(--mut);margin-bottom:8px}
.q{margin-bottom:12px}.yn{display:flex;gap:8px;margin-top:8px}.yn button{flex:1}.yn .on{background:var(--ink);color:#fff;border-color:var(--ink)}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}.slot{border:2px dashed var(--line);border-radius:12px;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--mut);font-size:13px;position:relative;overflow:hidden;cursor:pointer;background:#fafbfc}
.slot img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}.slot .x{position:absolute;top:6px;right:6px;z-index:2;min-height:30px;padding:2px 8px;background:rgba(0,0,0,.6);color:#fff;border:0}
.slot .lbl{position:absolute;left:6px;bottom:6px;z-index:2;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:2px 6px;border-radius:6px}
.sticky{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 25%);padding:16px 0 10px}.sticky button{width:100%;min-height:54px;font-size:16px}
.req{font-size:13px;color:var(--bad);margin-top:6px}
.bar{height:10px;background:#e7eaf0;border-radius:99px;overflow:hidden;display:flex}.bar i{display:block;height:100%}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.kpi .n{font-size:28px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}th{font-size:12px;color:var(--mut);text-transform:uppercase}tbody tr{cursor:pointer}tbody tr:hover{background:#f7f9fc}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.tools input,.tools select{width:auto;flex:1;min-width:140px}.tools input[type=checkbox]{flex:none;min-width:0}
.modal{position:fixed;inset:0;background:rgba(15,20,30,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}.modal .card{width:100%;max-width:760px;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;margin:0}
@media(min-width:760px){.modal{align-items:center}.modal .card{border-radius:16px}}
.flag{color:var(--bad);font-weight:600;font-size:12px}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:8px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;z-index:30;font-size:14px}
.hide-m{}@media(max-width:700px){.hide-m{display:none}}
.soon{font-size:11px;background:#eef0f3;color:var(--mut);padding:2px 6px;border-radius:6px;font-weight:600}

 m.innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Store #${s.id} ${badge(status(s))}</h2><button class="sm" onclick="this.closest('.modal').remove()">Close</button></div>
 <div class="mut">${esc(s.addr)}, ${esc(s.city)}, TN ${esc(s.zip)} · ${teamOf(s)}${s.cig?' · Cig reset only':''}${p.demo?' · seeded demo data':''}</div>
 <div class="mut" style="margin-top:4px">Shares 2ft shelf with ON: <b>${s.cig?'n/a':p.ans.on||'—'}</b> · Altria already removed Marlboro: <b>${p.ans.alt||'—'}</b></div>
 ${['before','after'].map(k=>`<h3 style="margin-top:14px">${k==='before'?'Before':'After'} photos</h3>${p.photos[k].length?`<div class="photos">${p.photos[k].map(src=>`<div class="slot" style="cursor:default"><img src="${src}"></div>`).join('')}</div>`:'<div class="flag">No photo yet</div>'}`).join('')}
 <h3 style="margin-top:14px">Checklist <span class="mut">${pct(s)}%</span></h3>${Object.keys(p.ans).length||!questions(s).length?visBrands(s).map(g=>`<div style="font-weight:700;margin-top:8px">${g.b}</div>`+g.items.filter(([i])=>v.includes(i)).map(([i,t])=>`<div style="padding:4px 0">${p.tasks[i]?'<span style="color:var(--ok)">✔</span>':'<span class="mut">○</span>'} ${t}</div>`).join('')).join(''):'<div class="mut">Rep has not started this store.</div>'}
 ${p.notes?`<h3 style="margin-top:14px">Notes</h3><div class="note">${esc(p.notes)}</div>`:''}</div>`;document.body.appendChild(m)}
function csvCell(x){x=String(x??'');return/[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x}
function exportCSV(){const H=['Store','Street Address','City','State','Zip','Team','Cig Reset Only','Status','Tasks %','Shares 2ft w/ ON','Altria removed Marlboro','Before photos','After photos','Issue','Notes','Submitted','Demo data'];
 const rows=S.stores.map(s=>{const p=S.prog[s.id]||blank();return[s.id,s.addr,s.city,s.state,s.zip,teamOf(s),s.cig?1:'',SL[status(s)],pct(s),p.ans.on||'',p.ans.alt||'',p.photos.before.length,p.photos.after.length,p.issue?'Y':'',p.notes,p.submitted||'',p.demo?'Y':'']});
 const csv=[H,...rows].map(r=>r.map(csvCell).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`reset-report-${new Date().toISOString().slice(0,10)}.csv`;document.body.appendChild(a);a.click();a.remove();toast('Report downloaded')}
function parseCSV(t){const R=[];let r=[],f='',qd=false;for(let i=0;i<t.length;i++){const ch=t[i];if(qd){if(ch==='"'&&t[i+1]==='"'){f+='"';i++}else if(ch==='"')qd=false;else f+=ch}else if(ch==='"')qd=true;else if(ch===','){r.push(f);f=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(f);R.push(r);r=[];f=''}else f+=ch}if(f||r.length){r.push(f);R.push(r)}return R.filter(x=>x.some(c=>c.trim()))}
const imp=document.getElementById('impIn');imp.onchange=()=>{const f=imp.files[0];imp.value='';if(!f)return;
 if(/\.xlsx$/i.test(f.name)){alert('.xlsx import is coming soon in this demo.\nIn Excel, use File → Save As → CSV, then import the .csv file.');return}
 const r=new FileReader();r.onload=()=>{const R=parseCSV(r.result);if(R.length<2)return toast('No rows found');const h=R[0].map(x=>x.trim().toLowerCase());const ix=n=>h.findIndex(x=>x.includes(n));
  const iA=ix('account')>=0?ix('account'):ix('store'),iS=ix('street'),iC=ix('city'),iSt=ix('state'),iZ=ix('zip'),iG=ix('cig'),iT=ix('team');if(iA<0)return toast('Need an "Account Name" or "Store" column');
  const team=prompt('Assign imported stores to which team? ('+S.teams.join(' / ')+' or a new name)','Scott and Collin');if(!team)return;if(!S.teams.includes(team))S.teams.push(team);
  let add=0,upd=0;R.slice(1).forEach(c=>{const id=(c[iA]||'').trim();if(!id)return;const o={id,addr:c[iS]||'',city:c[iC]||'',state:c[iSt]||'',zip:c[iZ]||'',cig:/^(1|y|yes|true|x)$/i.test((c[iG]||'').trim())?1:0,team:iT>=0&&c[iT]?c[iT]:team};
   const e=S.stores.find(s=>s.id===id);if(e){Object.assign(e,o);upd++}else{S.stores.push(o);add++}});save();toast(`Imported: ${add} new, ${upd} updated`);rPM()};r.readAsText(f)};
load();render();
</script></body></html>
